<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Splitter</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #f4f6f9; --card: #ffffff; --text: #111827; --muted: #6b7280; --border: #d1d5db; --primary: #2563eb; --primary-hover: #1d4ed8; --result-bg: #f8fafc; --error-text: #dc2626; --error-bg: #fef2f2; --error-border: #fecaca; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; line-height: 1.5; }
.card { background: var(--card); width: 100%; max-width: 420px; border-radius: 16px; padding: 28px 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 4px 10px -6px rgba(0, 0, 0, 0.04); }
h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.02em; }
.subtitle { font-size: 0.9rem; color: var(--muted); margin-bottom: 24px; }
.field { margin-bottom: 16px; }
label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
input[type="number"] { width: 100%; padding: 12px 14px; font-size: 1rem; color: var(--text); background: #fff; border: 1.5px solid var(--border); border-radius: 10px; outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease; -moz-appearance: textfield; }
input[type="number"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
#calc { width: 100%; margin-top: 8px; padding: 13px 16px; font-size: 1rem; font-weight: 600; color: #ffffff; background: var(--primary); border: none; border-radius: 10px; cursor: pointer; transition: background-color 0.15s ease, transform 0.05s ease; }
#calc:hover { background: var(--primary-hover); }
#calc:active { transform: scale(0.99); }
#summary { margin-top: 20px; font-size: 0.85rem; color: var(--muted); display: none; justify-content: space-between; padding: 0 4px 8px; border-bottom: 1px solid #e5e7eb; }
#result { margin-top: 12px; padding: 14px 16px; border-radius: 10px; background: var(--result-bg); border: 1px solid #e5e7eb; white-space: pre-line; font-size: 0.975rem; font-variant-numeric: tabular-nums; line-height: 1.75; min-height: 24px; display: none; }
#result.visible { display: block; }
#result.error { margin-top: 20px; color: var(--error-text); background: var(--error-bg); border-color: var(--error-border); font-weight: 500; }
@media (max-width: 360px) { .card { padding: 22px 18px; } .row { grid-template-columns: 1fr; gap: 0; } }
</style>
</head>
<body>
<main class="card">
<h1>Bill Splitter</h1>
<p class="subtitle">Split a bill evenly down to the exact cent.</p>
<div class="field">
<label for="total">Bill Amount ($)</label>
<input id="total" type="number" step="0.01" placeholder="0.00" inputmode="decimal">
</div>
<div class="row">
<div class="field">
<label for="tip">Tip (%)</label>
<input id="tip" type="number" step="0.1" value="15" inputmode="decimal">
</div>
<div class="field">
<label for="people">People</label>
<input id="people" type="number" step="1" value="2" inputmode="numeric">
</div>
</div>
<button id="calc" type="button">Split</button>
<div id="summary" aria-live="polite"></div>
<div id="result" aria-live="polite"></div>
</main>
<script>
(function () {
const totalInput = document.getElementById('total');
const tipInput = document.getElementById('tip');
const peopleInput = document.getElementById('people');
const calcBtn = document.getElementById('calc');
const resultEl = document.getElementById('result');
const summaryEl = document.getElementById('summary');
function showInvalid() {
summaryEl.style.display = 'none';
summaryEl.textContent = '';
resultEl.className = 'visible error';
resultEl.textContent = 'Invalid input';
}
function splitBill() {
const totalRaw = totalInput.value.trim();
const tipRaw = tipInput.value.trim();
const peopleRaw = peopleInput.value.trim();
const bill = Number(totalRaw);
const tip = tipRaw === '' ? 0 : Number(tipRaw);
const people = Number(peopleRaw);
if (
totalRaw === '' ||
!Number.isFinite(bill) ||
bill <= 0 ||
!Number.isFinite(tip) ||
tip < 0 ||
peopleRaw === '' ||
!Number.isInteger(people) ||
people < 1
) {
showInvalid();
return;
}
const grandTotal = bill + bill * (tip / 100);
const totalCents = Math.round(Number((grandTotal * 100).toFixed(8)));
const baseCents = Math.floor(totalCents / people);
const remainder = totalCents % people;
const lines = [];
for (let i = 1; i <= people; i++) {
const shareCents = baseCents + (i <= remainder ? 1 : 0);
lines.push(`Person ${i}: $${(shareCents / 100).toFixed(2)}`);
}
summaryEl.style.display = 'flex';
summaryEl.innerHTML =
`<span>Grand Total</span><strong>$${(totalCents / 100).toFixed(2)}</strong>`;
resultEl.className = 'visible';
resultEl.textContent = lines.join('\n');
}
calcBtn.addEventListener('click', splitBill);
[totalInput, tipInput, peopleInput].forEach(function (input) {
input.addEventListener('keydown', function (event) {
if (event.key === 'Enter') {
event.preventDefault();
splitBill();
}
});
});
})();
</script>
</body>
</html>
