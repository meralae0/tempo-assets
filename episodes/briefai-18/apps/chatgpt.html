<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill Splitter</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f1f5f9; color: #172033; font: 16px/1.5 system-ui, sans-serif; }
main { width: 100%; max-width: 440px; background: white; padding: clamp(20px, 6vw, 32px); border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 12px 40px #17203312; }
h1 { margin: 0; font-size: 30px; letter-spacing: -1px; }
p { color: #64748b; margin: 6px 0 24px; }
label { display: block; font-weight: 600; margin: 16px 0 6px; }
input, button { width: 100%; font: inherit; border-radius: 10px; padding: 12px 14px; }
input { border: 1px solid #cbd5e1; background: #f8fafc; color: inherit; }
input:focus-visible, button:focus-visible { outline: 3px solid #818cf8; outline-offset: 2px; }
button { margin-top: 24px; border: 0; background: #4338ca; color: white; font-weight: 700; cursor: pointer; }
button:hover { background: #3730a3; }
#result { margin-top: 20px; white-space: pre-wrap; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; line-height: 1.9; }
#result:not(:empty) { padding: 16px; background: #eef2ff; border-radius: 12px; }
</style>
</head>
<body>
<main>
<h1>Bill Splitter</h1>
<p>Share the bill, down to the last cent.</p>
<form novalidate>
<label for="total">Bill amount ($)</label>
<input id="total" type="number" min="0" step="any" placeholder="0.00" inputmode="decimal" required>
<label for="tip">Tip (%)</label>
<input id="tip" type="number" min="0" step="any" value="15" inputmode="decimal" required>
<label for="people">Number of people</label>
<input id="people" type="number" min="1" step="1" value="2" inputmode="numeric" required>
<button id="calc" type="submit">Split</button>
</form>
<div id="result" role="status" aria-live="polite"></div>
</main>
<script>
'use strict';
const total = document.getElementById('total');
const tip = document.getElementById('tip');
const people = document.getElementById('people');
const result = document.getElementById('result');

// Convert decimal input to an exact integer fraction, avoiding float rounding.
function fraction(value) {
const [mantissa, exponent = '0'] = value.toLowerCase().split('e');
const [whole, decimal = ''] = mantissa.split('.');
const digits = BigInt(whole + decimal);
if (digits === 0n) return [0n, 1n];
const scale = decimal.length - Number(exponent);
return scale >= 0
? [digits, 10n ** BigInt(scale)]
: [digits * 10n ** BigInt(-scale), 1n];
}
function dollars(cents) {
return '$' + (cents / 100n) + '.' + String(cents % 100n).padStart(2, '0');
}
function splitBill(event) {
event.preventDefault();
const bill = total.valueAsNumber;
const rate = tip.valueAsNumber;
const count = people.valueAsNumber;
if (!Number.isFinite(bill) || bill <= 0 ||
!Number.isFinite(rate) || rate < 0 ||
!Number.isSafeInteger(count) || count < 1) {
result.textContent = 'Invalid input';
return;
}
const [b, bd] = fraction(total.value);
const [t, td] = fraction(tip.value);
// Grand total in cents = bill * (100 + tip percentage).
const numerator = b * (100n * td + t);
const denominator = bd * td;
// Round once, to the nearest cent (half cents round up).
const cents = (2n * numerator + denominator) / (2n * denominator);
const n = BigInt(count);
const base = cents / n;
const remainder = cents % n;
const lines = [];
for (let i = 0; i < count; i++) {
const share = base + (BigInt(i) < remainder ? 1n : 0n);
lines.push(`Person ${i + 1}: ${dollars(share)}`);
}
result.textContent = lines.join('\n');
}
document.querySelector('form').addEventListener('submit', splitBill);
</script>
</body>
</html>
